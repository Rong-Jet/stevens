<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stevens — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="settings">
    <h1>Stevens Settings</h1>

    <label for="apiKey">DeepL API Key</label>
    <input id="apiKey" type="password" placeholder="xxxx-xxxx-xxxx-xxxx:fx" autocomplete="off" />

    <label for="sourceLang">Source Language</label>
    <select id="sourceLang">
      <option value="auto">Auto-detect</option>
      <option value="EN">English</option>
      <option value="DE">German</option>
      <option value="FR">French</option>
      <option value="ES">Spanish</option>
      <option value="IT">Italian</option>
      <option value="JA">Japanese</option>
      <option value="ZH">Chinese (Simplified)</option>
      <option value="KO">Korean</option>
      <option value="PT">Portuguese</option>
      <option value="RU">Russian</option>
      <option value="NL">Dutch</option>
      <option value="PL">Polish</option>
      <option value="SV">Swedish</option>
      <option value="TR">Turkish</option>
    </select>

    <label for="targetLang">Target Language</label>
    <select id="targetLang">
      <option value="EN">English</option>
      <option value="DE">German</option>
      <option value="FR">French</option>
      <option value="ES">Spanish</option>
      <option value="IT">Italian</option>
      <option value="JA">Japanese</option>
      <option value="ZH">Chinese (Simplified)</option>
      <option value="KO">Korean</option>
      <option value="PT">Portuguese</option>
      <option value="RU">Russian</option>
      <option value="NL">Dutch</option>
      <option value="PL">Polish</option>
      <option value="SV">Swedish</option>
      <option value="TR">Turkish</option>
    </select>

    <button id="save">Save</button>
    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script src="../../dist/options.js" type="module"></script>
</body>
</html>
